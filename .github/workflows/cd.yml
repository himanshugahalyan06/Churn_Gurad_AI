name: Docker Build

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build -t churnguard-api -f docker/Dockerfile.api .
      
      # NOTE: Push step is intentionally commented out as registry credentials
      # are not currently configured. When ready, add Docker login step and:
      # - run: docker push your-registry/churnguard-api:latest